; Radha Rani Portal - PHP CLI / FPM overrides
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 5
; Bill PDFs are held in memory briefly to write both the folder and database
; copies, so leave generous headroom above the 20 MB upload limit.
memory_limit = 256M
max_execution_time = 120
display_errors = Off
log_errors = On
error_reporting = E_ALL
date.timezone = Asia/Kolkata

session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1