services:
  db:
    image: mysql:8.0
    container_name: radha_rani_db
    restart: unless-stopped
    environment:
      # Passwords come from docker/.env (git-ignored) with a dev-only
      # fallback. The fallback is fine for a laptop and MUST be overridden
      # anywhere reachable - the value below is published in this repo.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: radha_rani
      MYSQL_USER: radha
      MYSQL_PASSWORD: ${DB_PASSWORD:-radhapass}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # $$ escapes the variable so Compose passes a literal $ to the
      # container, where the shell expands it from the environment.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radha_rani_php
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8091
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: radha_rani
      DB_USER: radha
      DB_PASS: ${DB_PASSWORD:-radhapass}
    volumes:
      - ../:/var/www
      - ./php.ini:/usr/local/etc/php/conf.d/radha_rani.ini:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: radha_rani_nginx
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ../:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  db_data: