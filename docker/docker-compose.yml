services:
  db:
    image: mysql:8.0
    container_name: radha_rani_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: radha_rani
      MYSQL_USER: radha
      MYSQL_PASSWORD: radhapass
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radha_rani_php
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8091
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: radha_rani
      DB_USER: radha
      DB_PASS: radhapass
    volumes:
      - ../:/var/www
      - ./php.ini:/usr/local/etc/php/conf.d/radha_rani.ini:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: radha_rani_nginx
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ../:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  db_data: