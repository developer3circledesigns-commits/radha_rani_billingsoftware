services:
  db:
    image: mysql:8.0
    container_name: radha_rani_db
    restart: unless-stopped
    environment:
      # Passwords come from docker/.env (git-ignored) with a dev-only
      # fallback. The fallback is fine for a laptop and MUST be overridden
      # anywhere reachable - the value below is published in this repo.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: radha_rani
      MYSQL_USER: radha
      MYSQL_PASSWORD: ${DB_PASSWORD:-radhapass}
    ports:
      # Bind to loopback only: the dev passwords are weak, so never expose
      # MySQL on the LAN. Host tools (workbench, mysql CLI) still reach it.
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # $$ escapes the variable so Compose passes a literal $ to the
      # container, where the shell expands it from the environment.
      #
      # mysqladmin ping reports success even when the password is wrong,
      # so run a real authenticated query instead. A wrong DB_ROOT_PASSWORD
      # then fails the healthcheck instead of looking healthy.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radha_rani_php
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8092
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: radha_rani
      DB_USER: radha
      DB_PASS: ${DB_PASSWORD:-radhapass}
    volumes:
      - ../:/var/www
      - ./php.ini:/usr/local/etc/php/conf.d/radha_rani.ini:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # php-fpm listens on 9000; a TCP connect is enough to know it can
      # accept FastCGI requests. Prevents nginx from serving 502s on boot.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.25-alpine
    container_name: radha_rani_nginx
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      # Only the document root is mounted, read-only. The app code,
      # database schema and storage are not visible to nginx at all.
      - ../public:/var/www/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

volumes:
  db_data:
