server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 25M;

    # Hide sensitive paths
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|sql|md|ini|log|json|sh|bak)$ {
        deny all;
    }

    # Keep these unreachable even if the document root is ever widened past
    # /var/www/public (mirrors the .htaccess rules used on shared hosting).
    location ~* ^/(app|tools|database|docker|db|vendor|storage)(/|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}