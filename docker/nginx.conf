server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Do not advertise the nginx version in Server: headers.
    server_tokens off;

    charset utf-8;
    client_max_body_size 25M;

    # Mirror the security headers set by public/.htaccess on Apache, so the
    # Docker stack has the same protections. "always" keeps them on errors.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The branch upload page uses getUserMedia for the bill camera, so the
    # camera must be allowed for this origin; microphone and geolocation stay
    # disabled because nothing in the portal asks for them.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hide sensitive paths
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|sql|md|ini|log|json|sh|yml|yaml|bak|old|orig|save|swp|tar|gz|zip)$ {
        deny all;
    }

    # Keep these unreachable even if the document root is ever widened past
    # /var/www/public (mirrors the .htaccess rules used on shared hosting).
    location ~* ^/(app|tools|database|docker|db|vendor|storage)(/|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets. No add_header here: any add_header in a nested location
    # would drop the server-level security headers.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Match PHP's 120s max_execution_time so slow PDF uploads are not
        # cut off by FastCGI's shorter default.
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }
}
