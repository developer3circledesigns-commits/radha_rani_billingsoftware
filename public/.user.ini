; Radha Rani Hotel Portal - per-directory PHP settings
;
; This is the shared-hosting safe way to raise PHP limits. It works on
; LiteSpeed / PHP-FPM (Hostinger, cPanel) where "php_value" inside .htaccess
; is rejected with a 500 error because it requires mod_php.
;
; .user.ini only applies to PHP-FPM / CGI / LiteSpeed. Values set in hPanel
; ("Select PHP Version" -> "PHP Settings") override this file, so make sure
; the hPanel values are at least as large as these.

; --- Bill PDF uploads -------------------------------------------------
; Keep these in step with the "Maximum PDF Size" setting in the portal and
; with MySQL's max_allowed_packet (see tools/deploy-check.php).
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 5

; PDFs are read into memory to write the folder copy and the database copy,
; so leave headroom above the upload limit.
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; --- Sessions ---------------------------------------------------------
; Sessions are file based; Hostinger allows a session save path, and the
; default (the account's own tmp folder) is already private to you.
session.gc_maxlifetime = 1800
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_trans_sid = 0

; --- Hardening --------------------------------------------------------
expose_php = Off
display_errors = Off
log_errors = On
; Never render PHP errors in a browser; the app logs to storage/logs instead.
